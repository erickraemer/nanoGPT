wandb:
  project_name: "test"
  run_name: "test-attention-entropy"
  # TH:   Total Heads
  # HAS:  Head Activation Schedule
  # TE:   Token Encoding
  # O:    Optimizer
  # WD:   Weight Decay
  # NSA2: New Self Attention 2

logging:
  wandb: True
  interval: 200

eval:
  only: False
  interval: 200
  iters: 200

metrics:
  head_dropout: False
  attention_head_norms: False
  projection_head_norms: False
  attention_head_distribution: False
  attention_entropy: True

checkpointing:
  out_dir: "out"
  interval: 100_000

data:
  path: "/home/eric/Documents/nanoGPT/data"
  dataset: "openwebtext"
  seed: 1337
  gradient_accumulation_steps: 5
  batch_size: 8
  block_size: 512

model:
  seed: 1337
  checkpoint: ""
  layer: 4
  heads: 4
  embedding_size: 512
  head_dimension: 64
  vocab_size: 50304
  dropout_rate: 0.0
  bias: False
  compile: True
  dtype: "bfloat16"

head_activation_schedule:
  0: 2
  4_000: 4

adamw:
  beta1: 0.9
  beta2: 0.95

optimizer:
  name: "adamw" # adamw or sgd
  learning_rate: 6e-4
  max_iters: 100_000
  weight_decay: 0.0
  grad_clip: 1.0

lr_scheduler:
  decay: True
  warmup_iters: 2000
  decay_iters: 600_000
  min_lr: 6e-5

