wandb:
  project_name: "adaptive-multi-head-attention"
  run_name: "gpt2-dist-logging-TH:8-HAS(0:8)-O:AdamW"
  # TH:   Total Heads
  # HAS:  Head Activation Schedule
  # TE:   Token Encoding
  # O:    Optimizer
  # WD:   Weight Decay
  # NSA2: New Self Attention 2

logging:
  wandb: True
  interval: 200

eval:
  only: False
  interval: 100
  iters: 200

checkpointing:
  out_dir: "out"
  interval: 10_000

data:
  path: "/home/ekraemer/nanoGPT/data"
  dataset: "openwebtext"
  gradient_accumulation_steps: 5
  batch_size: 8
  block_size: 512

model:
  seed: 1337
  checkpoint: ""
  layer: 8
  heads: 8
  embedding_size: 512
  vocab_size: 50304
  dropout_rate: 0.0
  bias: False
  compile: True
  dtype: "bfloat16"

head_activation_schedule:
  0: 8

adamw:
  beta1: 0.9
  beta2: 0.95

optimizer:
  name: "adamw" # adamw or sgd
  learning_rate: 6e-4
  max_iters: 100_000
  weight_decay: 0.0
  grad_clip: 1.0

lr_scheduler:
  decay: True
  warmup_iters: 2000
  decay_iters: 600_000
  min_lr: 6e-5

