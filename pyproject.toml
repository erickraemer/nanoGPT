[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend= "setuptools.build_meta"

[project]
name = "nanoGPT"
version = "0.1.0"
description = "A minimalistic implementation of GPT in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.1",
    "numpy>=2.3.1",
    "transformers>=4.53.0",
    "datasets>=3.6.0",
    "tiktoken>=0.9.0",
    "wandb>=0.21.0",
    "tqdm>=4.67.1",
    "tabulate>=0.9.0",
    "omegconf>=2.3.0"
]
